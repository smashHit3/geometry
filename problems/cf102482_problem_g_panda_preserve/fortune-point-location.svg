<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Point location using the next polygon edge in vertical order</title>
  <desc id="desc">An inside query sees an upper boundary first at greater y. An outside query above the park sees a lower boundary first.</desc>
  <defs>
    <marker id="up-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0969da"/>
    </marker>
    <style>
      .heading { font: 700 18px sans-serif; fill: #24292f; }
      .label { font: 15px sans-serif; fill: #24292f; }
      .small { font: 14px sans-serif; fill: #57606a; }
      .park { fill: #dafbe1; stroke: #1a7f37; stroke-width: 4; stroke-linejoin: round; }
      .query { fill: #bf8700; stroke: white; stroke-width: 2; }
      .ray { stroke: #0969da; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#up-arrow); }
      .upper { stroke: #8250df; stroke-width: 8; }
      .lower { stroke: #cf222e; stroke-width: 8; }
      .divider { stroke: #d0d7de; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>
  <line class="divider" x1="450" y1="18" x2="450" y2="380"/>

  <text x="72" y="34" class="heading">Inside query</text>
  <path class="park" d="M70 75 L380 75 L380 315 L70 315 Z"/>
  <line class="upper" x1="70" y1="315" x2="380" y2="315"/>
  <circle class="query" cx="220" cy="180" r="9"/>
  <line class="ray" x1="220" y1="193" x2="220" y2="302"/>
  <text x="233" y="185" class="label">query</text>
  <text x="237" y="250" class="small">first greater-y edge</text>
  <text x="178" y="304" class="label">UpperBoundary</text>
  <text x="79" y="352" class="label">first edge returned is upper</text>
  <text x="136" y="375" class="small">therefore inside</text>

  <text x="520" y="34" class="heading">Outside query</text>
  <path class="park" d="M500 110 L830 110 L830 300 L500 300 Z"/>
  <line class="lower" x1="500" y1="110" x2="830" y2="110"/>
  <circle class="query" cx="665" cy="60" r="9"/>
  <line class="ray" x1="665" y1="73" x2="665" y2="102"/>
  <text x="680" y="66" class="label">query</text>
  <text x="610" y="133" class="label">LowerBoundary</text>
  <text x="529" y="352" class="label">first edge returned is lower</text>
  <text x="594" y="375" class="small">therefore outside</text>
</svg>
