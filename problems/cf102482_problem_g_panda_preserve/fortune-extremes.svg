<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Extreme intersections on a Voronoi edge</title>
  <desc id="desc">A Voronoi edge passes through a non-convex polygon in several intervals. Only the first intersection from each direction is needed.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#8250df"/>
    </marker>
    <style>
      .heading { font: 700 18px sans-serif; fill: #24292f; }
      .label { font: 15px sans-serif; fill: #24292f; }
      .small { font: 14px sans-serif; fill: #57606a; }
      .park { fill: #dafbe1; stroke: #1a7f37; stroke-width: 4; stroke-linejoin: round; }
      .edge { stroke: #57606a; stroke-width: 3; stroke-dasharray: 8 6; }
      .inside { stroke: #8250df; stroke-width: 8; stroke-linecap: round; }
      .extreme { fill: #bf8700; stroke: white; stroke-width: 2; }
      .crossing { fill: #ffffff; stroke: #8250df; stroke-width: 3; }
    </style>
  </defs>

  <rect width="900" height="390" fill="#ffffff"/>
  <text x="30" y="38" class="heading">A non-convex park can cut one Voronoi edge many times</text>

  <path class="park" d="M90 82 L310 72 L310 158 L430 158 L430 76 L670 86 L800 195 L670 306 L430 314 L430 230 L310 230 L310 312 L92 300 L35 194 Z"/>

  <line class="edge" x1="24" y1="194" x2="866" y2="194"/>
  <line class="inside" x1="35" y1="194" x2="310" y2="194"/>
  <line class="inside" x1="430" y1="194" x2="800" y2="194"/>

  <circle class="extreme" cx="35" cy="194" r="8"/>
  <circle class="crossing" cx="310" cy="194" r="7"/>
  <circle class="crossing" cx="430" cy="194" r="7"/>
  <circle class="extreme" cx="800" cy="194" r="8"/>

  <text x="27" y="224" class="label">a1</text>
  <text x="299" y="224" class="label">b1</text>
  <text x="419" y="224" class="label">a2</text>
  <text x="790" y="224" class="label">b2</text>

  <line x1="60" y1="344" x2="280" y2="344" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="76" y="335" class="label">forward sweep finds a1</text>

  <line x1="782" y1="344" x2="562" y2="344" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="604" y="335" class="label">reverse sweep finds b2</text>

  <text x="332" y="270" class="small">outside the park</text>
  <text x="268" y="375" class="small">Intermediate crossings cannot beat both global parameter extremes.</text>
</svg>
